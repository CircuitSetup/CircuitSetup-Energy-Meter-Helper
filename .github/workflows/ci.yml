name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect firmware-affecting changes
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: filter
        name: Check changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PUSH_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$PUSH_SHA"
          fi

          if [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            changed_files="$(git show --format= --name-only "$head")"
          else
            changed_files="$(git diff --no-renames --name-only "$base" "$head")"
          fi

          printf '%s\n' "$changed_files"
          # Only YAML configuration inputs and their parsing/generation code need
          # ESPHome validation and compilation. UI, HA plumbing, and tests do not.
          if printf '%s\n' "$changed_files" | grep -Eq \
            '^(custom_components/circuitsetup_energy_meter_helper/(config_blocks|config_document|config_mutator|meter_config_mutator|meter_configuration|meter_inventory|total_graph|topology|voltage_gains|ct_catalog|voltage_transformer_catalog)\.py|(custom_components/|tests/fixtures/).*\.ya?ml|scripts/(generate_esphome_validation_configs|verify_firmware_contract)\.py)$'; then
            echo "firmware=true" >> "$GITHUB_OUTPUT"
          else
            echo "firmware=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run mypy custom_components/circuitsetup_energy_meter_helper
      - run: uv run pytest -q --cov=custom_components.circuitsetup_energy_meter_helper --cov-report=term-missing
      - run: uv pip check
  browser-e2e:
    name: Browser E2E and accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
      - run: uv sync --all-groups
        working-directory: .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Require committed frontend artifacts to match the build
        run: test -z "$(git status --porcelain -- ../custom_components/circuitsetup_energy_meter_helper/frontend)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  home-assistant-contract:
    name: Home Assistant contract tests (${{ matrix.ha-channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-channel: stable
            experimental: false
          - ha-channel: dev
            experimental: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
      - run: uv sync --all-groups
      - name: Install Home Assistant dev
        if: matrix.ha-channel == 'dev'
        run: uv pip install --upgrade git+https://github.com/home-assistant/core.git@dev
      - name: Show Home Assistant version
        run: |
          uv run --no-sync python -c "from homeassistant.const import __version__; print(f'Home Assistant version: {__version__}')"
      - name: Run Home Assistant contract tests
        run: uv run --no-sync pytest -q

  home-assistant-control-entity-contract:
    name: Home Assistant control entity contract
    needs: home-assistant-contract
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require Home Assistant contract matrix
        run: |
          if [ "${{ needs.home-assistant-contract.result }}" != "success" ]; then
            echo "Home Assistant contract matrix result: ${{ needs.home-assistant-contract.result }}"
            exit 1
          fi
          echo "Home Assistant contract matrix completed successfully."

  firmware-contract:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pinned
            ref: 3820c5e395379cc4de16fdcac41cabc13788eb8b
          - name: adopted
            ref: 29e2c5deef983bd9e9ee104f49e321e6f6634ed9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14.2"
      - run: uv sync --all-groups
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: CircuitSetup/Expandable-6-Channel-ESP32-Energy-Meter
          ref: ${{ matrix.ref }}
          path: firmware
      - name: Test pinned firmware total hierarchy
        run: uv sync --all-groups && uv run pytest -q tests/test_firmware_total_contract.py
        env:
          FIRMWARE_ROOT: firmware
      - name: Verify ${{ matrix.name }} catalog, package, and project contracts
        run: python scripts/verify_firmware_contract.py . firmware
      - name: Run Helper package tests against ${{ matrix.name }} checkout
        env:
          FIRMWARE_ROOT: firmware
        run: uv run --no-sync pytest -q tests/test_firmware_package_contract.py
      - name: Run upstream firmware topology and calibration tests
        run: uvx --python 3.12 --from pytest==9.0.2 pytest -q firmware/Software/ESPHome/tests
      - name: Generate Helper mutations for the real package stack
        run: |
          uv run --no-sync python scripts/generate_esphome_validation_configs.py firmware generated-esphome
      - name: Validate generated configs with ESPHome 2026.8.0
        run: |
          for config in generated-esphome/*.yaml; do
            uvx --python 3.12 --from esphome==2026.8.0 esphome config "$config"
          done
      - name: Compile the pinned main mutation with ESPHome 2026.8.0
        run: uvx --python 3.12 --from esphome==2026.8.0 esphome compile generated-esphome/used-unity-pq.yaml
      - name: Compile the two-voltage add-on mutation with ESPHome 2026.8.0
        run: uvx --python 3.12 --from esphome==2026.8.0 esphome compile generated-esphome/two-voltages-used-m8.yaml
