name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run mypy custom_components/circuitsetup_energy_meter_helper
      - run: uv run pytest -q --cov=custom_components.circuitsetup_energy_meter_helper
      - run: uv pip check
      - name: Validate HACS repository
        uses: docker://ghcr.io/hacs/action@sha256:41f6310585d9fb72c7a0e183cce0594355715bc24112b62bc4279b83412edccb
        env:
          INPUT_CATEGORY: integration
          INPUT_COMMENT: "false"
          INPUT_GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm audit && npm run typecheck && npm run test && npm run build
      - name: Require committed frontend artifacts to match the build
        run: test -z "$(git status --porcelain -- custom_components/circuitsetup_energy_meter_helper/frontend)"
      - run: cd frontend && npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: CircuitSetup/Expandable-6-Channel-ESP32-Energy-Meter
          ref: 3820c5e395379cc4de16fdcac41cabc13788eb8b
          path: firmware
      - name: Verify firmware catalog schema and supported project patterns
        run: python scripts/verify_firmware_contract.py . firmware
      - name: Run pinned firmware topology and calibration tests
        run: uvx --python 3.12 --from pytest==9.0.2 pytest -q firmware/Software/ESPHome/tests
  publish:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          tag="v$(python -c 'import json; print(json.load(open("custom_components/circuitsetup_energy_meter_helper/manifest.json"))["version"])')"
          target="$VALIDATED_SHA"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if ! existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
              echo "$tag does not resolve to a commit" >&2
              exit 1
            fi
            if [[ "$existing" != "$target" ]]; then
              echo "$tag resolves to $existing, not validated commit $target" >&2
              exit 1
            fi
          fi
          gh api --method POST "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$tag" -f target_commitish="$target" --jq .body > generated-release-notes.md
          python scripts/strip_release_usernames.py < generated-release-notes.md > release-notes.md
          gh release create "$tag" --target "$target" --notes-file release-notes.md
