name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run mypy custom_components/circuitsetup_energy_meter_helper
      - run: uv run pytest -q --cov=custom_components.circuitsetup_energy_meter_helper
      - run: uv pip check
      - name: Validate HACS repository
        uses: docker://ghcr.io/hacs/action@sha256:41f6310585d9fb72c7a0e183cce0594355715bc24112b62bc4279b83412edccb
        env:
          INPUT_CATEGORY: integration
          INPUT_COMMENT: "false"
          INPUT_GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm audit && npm run typecheck && npm run test && npm run build
      - run: cd frontend && npx playwright install --with-deps chromium && npm run test:e2e
      - name: Require the installed bundle to match the built bundle
        run: |
          test -f custom_components/circuitsetup_energy_meter_helper/frontend/circuitsetup-energy-meter-helper-panel.js
          test "$(sha256sum frontend/dist/circuitsetup-energy-meter-helper-panel.js | cut -d' ' -f1)" = "$(sha256sum custom_components/circuitsetup_energy_meter_helper/frontend/circuitsetup-energy-meter-helper-panel.js | cut -d' ' -f1)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: CircuitSetup/Expandable-6-Channel-ESP32-Energy-Meter
          ref: 6145e2a0a0be46abb32f6808c093564594d80713
          path: firmware
      - name: Verify firmware catalog schema and supported project patterns
        run: python scripts/verify_firmware_contract.py . firmware
      - name: Run pinned firmware topology and calibration tests
        run: uvx --python 3.12 --from pytest==9.0.2 pytest -q firmware/Software/ESPHome/tests
      - name: Compile pinned representative firmware matrix
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          matrix = json.loads(subprocess.check_output(
              [sys.executable, "firmware/Software/ESPHome/tests/compile_matrix.py"],
              text=True,
          ))
          for configuration in matrix["configurations"]:
              subprocess.run(
                  [
                      "uvx", "--python", "3.12", "--from", "esphome",
                      "esphome", "compile", f"firmware/{configuration}",
                  ],
                  check=True,
              )
          PY
      - name: Require recorded physical validation before publishing
        run: |
          if ! python - <<'PY'
          import json
          rows = json.load(open("docs/hardware-validation.json"))
          required = {
              ("main", "wifi"), ("one-addon", "wifi"),
              ("three-addon-special-voltage", "special"), ("six-addon", "wifi"),
              ("addons", "lilygo-ethernet"), ("addons", "waveshare-ethernet"),
          }
          assert isinstance(rows, list) and len(rows) == len(required)
          assert {(row["topology"], row["connection"]) for row in rows} == required
          assert all(row.get("validated") is True for row in rows)
          PY
          then
            echo 'Physical hardware validation is still required.' >&2
            exit 1
          fi
  publish:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$(python -c 'import json; print(json.load(open("custom_components/circuitsetup_energy_meter_helper/manifest.json"))["version"])')" --generate-notes
