name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run mypy custom_components/circuitsetup_energy_meter_helper
      - run: uv run pytest -q --cov=custom_components.circuitsetup_energy_meter_helper
      - name: Require recorded physical validation before publishing
        run: |
          if grep -q '\[ \] Not recorded' docs/hardware-validation.md; then
            echo 'Physical hardware validation is still required.' >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$(python -c 'import json; print(json.load(open("custom_components/circuitsetup_energy_meter_helper/manifest.json"))["version"])')" --generate-notes
